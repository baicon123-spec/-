<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어 본문 복습</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --card: #fffdf7;
  --card2: #f0ead8;
  --accent: #c0392b;
  --accent2: #e67e22;
  --success: #27ae60;
  --danger: #e74c3c;
  --navy: #2c3e50;
  --text: #2c3e50;
  --muted: #95a5a6;
  --border: #d5c9b0;
  --shadow: 0 4px 20px rgba(0,0,0,0.1);
  --shadow2: 0 8px 32px rgba(0,0,0,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(192,57,43,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(230,126,34,0.04) 0%, transparent 50%);
  color: var(--text);
  font-family: 'Nanum Gothic', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── 홈 화면 ── */
.home-screen {
  width: 100%;
  max-width: 480px;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  animation: fadeUp 0.5s ease;
}
.home-hero {
  text-align: center;
  padding: 32px 0 16px;
}
.home-hero .book-icon { font-size: 3.5rem; margin-bottom: 12px; }
.home-title {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.44rem;
  color: var(--accent);
  letter-spacing: 1px;
  line-height: 1.3;
}
.home-sub {
  font-size: 0.85rem;
  color: var(--text);
  font-weight: 700;
  margin-top: 6px;
}

.home-disclaimer {
  text-align: center;
  padding: 16px 0 8px;
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--accent2);
  line-height: 1.8;
}
.section-label {
  font-size: 0.9rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 800;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-label::first-letter {
  font-size: 1.1rem;
}

.unit-list { display: flex; flex-direction: column; gap: 10px; }

.accordion-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.accordion-header {
  background: var(--navy);
  color: white;
  padding: 14px 16px;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 0.95rem;
  letter-spacing: 1px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.2s;
  user-select: none;
}
.accordion-header:active { background: #1a2535; }
.accordion-arrow {
  font-size: 0.8rem;
  transition: transform 0.3s ease;
}
.accordion-header.open .accordion-arrow {
  transform: rotate(90deg);
}
.accordion-body {
  display: none;
  flex-direction: column;
}
.accordion-body.open {
  display: flex;
  animation: fadeUp 0.3s ease;
}
.page-list { display: flex; flex-direction: column; }
.page-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--card2);
  cursor: pointer;
  transition: background 0.2s;
}
.page-item:last-child { border-bottom: none; }
.page-item:active { background: var(--card2); }
.page-info { display: flex; flex-direction: column; gap: 2px; }
.page-num {
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--accent);
}
.page-count { font-size: 0.75rem; color: var(--navy); font-weight: 700; }
.page-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn-mode {
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 0.75rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  font-family: 'Nanum Gothic', sans-serif;
  transition: transform 0.15s, opacity 0.2s;
  text-align: center;
  line-height: 1.4;
}
.btn-mode:active { transform: scale(0.93); }
.btn-review {
  background: var(--navy);
  color: white;
}
.btn-quiz {
  background: var(--accent);
  color: white;
}
.btn-write {
  background: #27ae60;
  color: white;
}
.btn-review {
  background: var(--navy);
  color: white;
}

/* ── 공통 헤더 ── */
.app-header {
  width: 100%;
  background: var(--card);
  border-bottom: 1.5px solid var(--border);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.btn-back {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  color: var(--text);
  font-family: 'Nanum Gothic', sans-serif;
  white-space: nowrap;
}
.header-title {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1rem;
  color: var(--navy);
  flex: 1;
}
.header-badge {
  background: var(--accent);
  color: white;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
}

/* ── 복습 모드 ── */
.review-screen {
  display: none;
  width: 100%;
  flex-direction: column;
}
.review-screen.show { display: flex; }
.review-content {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  padding: 20px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.review-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: fadeUp 0.3s ease;
}
.review-card-en {
  padding: 14px 16px 10px;
  font-family: 'Nanum Myeongjo', serif;
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--navy);
  font-weight: 700;
  border-bottom: 1px solid var(--card2);
}
.review-card-ko {
  padding: 10px 16px 14px;
  font-size: 0.88rem;
  line-height: 1.8;
  color: #7f8c8d;
  word-break: keep-all;
}
.review-num {
  font-size: 0.65rem;
  color: var(--muted);
  margin-bottom: 4px;
  font-weight: 700;
  letter-spacing: 1px;
}

/* ── 퀴즈 모드 ── */
.quiz-screen {
  display: none;
  width: 100%;
  flex-direction: column;
}
.quiz-screen.show { display: flex; }

.progress-bar-wrap {
  width: 100%;
  height: 3px;
  background: var(--border);
}
.progress-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.4s ease;
}

.quiz-content {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  padding: 20px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.q-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.q-label {
  font-size: 0.65rem;
  letter-spacing: 2px;
  color: var(--accent);
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 8px;
}
.q-sentence {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 1rem;
  line-height: 1.7;
  color: var(--navy);
  font-weight: 700;
}

.answer-label {
  font-size: 0.65rem;
  letter-spacing: 2px;
  color: var(--accent2);
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 8px;
}
.answer-zone {
  min-height: 64px;
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-content: flex-start;
  transition: border-color 0.3s, background 0.3s;
}
.answer-zone.correct-zone {
  border-color: var(--success);
  background: rgba(39,174,96,0.05);
  border-style: solid;
}
.answer-zone.wrong-zone {
  border-color: var(--danger);
  background: rgba(231,76,60,0.05);
  border-style: solid;
}
.answer-placeholder {
  color: var(--muted);
  font-size: 0.82rem;
  width: 100%;
  text-align: center;
  padding: 10px 0;
}

.block {
  background: var(--navy);
  color: white;
  border-radius: 10px;
  padding: 8px 13px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 6px rgba(44,62,80,0.2);
  white-space: nowrap;
}
.block:active { transform: scale(0.93); }
.block.in-answer {
  background: #34495e;
}
.block.selected-block {
  background: var(--accent2);
  box-shadow: 0 0 0 3px rgba(230,126,34,0.5);
  transform: scale(1.06);
}
.block.correct-block {
  background: var(--success);
  animation: popIn 0.3s ease;
}
.block.wrong-block {
  background: var(--danger);
  animation: shake 0.4s ease;
}

.pool-label {
  font-size: 0.65rem;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 8px;
}
.block-pool {
  min-height: 56px;
  background: var(--card2);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-content: flex-start;
}

.result-msg {
  text-align: center;
  font-size: 0.92rem;
  font-weight: 800;
  padding: 12px 16px;
  border-radius: 12px;
  display: none;
  animation: fadeUp 0.3s ease;
  line-height: 1.5;
}
.result-msg.correct {
  background: rgba(39,174,96,0.1);
  color: var(--success);
  border: 1.5px solid var(--success);
  display: block;
}
.result-msg.wrong {
  background: rgba(231,76,60,0.1);
  color: var(--danger);
  border: 1.5px solid var(--danger);
  display: block;
}

.btn-row { display: flex; gap: 10px; }
.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.92rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s;
}
.btn:active { transform: scale(0.96); }
.btn-check { background: var(--accent); color: white; }
.btn-reset { background: var(--card2); color: var(--muted); border: 1.5px solid var(--border); flex: 0.45; }
.btn-next { background: var(--success); color: white; display: none; }

/* ── 최종 화면 ── */
.final-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 50px 24px;
  text-align: center;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  animation: fadeUp 0.5s ease;
}
.final-screen.show { display: flex; }
.final-emoji { font-size: 4rem; }
.final-title {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 2rem;
  color: var(--accent);
}
.final-detail { color: var(--muted); font-size: 1rem; line-height: 1.8; }
.final-detail strong { color: var(--text); font-size: 1.3rem; }
.btn-home {
  background: var(--navy);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 40px;
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  margin-top: 8px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
  0%  { transform: scale(0.8); }
  60% { transform: scale(1.12); }
  100%{ transform: scale(1); }
}
@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-5px); }
  40%    { transform: translateX(5px); }
  60%    { transform: translateX(-3px); }
  80%    { transform: translateX(3px); }
}
</style>
</head>
<body>

<!-- ══ 홈 화면 ══ -->
<div id="homeScreen" class="home-screen">
  <div class="home-hero">
    <div class="book-icon">📚</div>
    <div class="home-title">영어 본문<br>복습 게임</div>
  </div>
  <div class="unit-section">
    <div class="section-label">📖 단원 선택</div>
    <div class="unit-list" id="unitList"></div>
  </div>
  <div class="home-disclaimer">
    <p>이 게임의 내용은 참고로만 사용해 주세요.</p>
    <p>업데이트 일시 : 2026년 11월 11일 14시 34분</p>
  </div>
</div>

<!-- ══ 복습 화면 ══ -->
<div id="reviewScreen" class="review-screen">
  <div class="app-header">
    <button class="btn-back" id="btnBackReview">← 홈</button>
    <div class="header-title" id="reviewTitle"></div>
    <div class="header-badge" id="reviewBadge"></div>
  </div>
  <div class="review-content" id="reviewContent"></div>
</div>

<!-- ══ 퀴즈 화면 ══ -->
<div id="quizScreen" class="quiz-screen">
  <div class="app-header">
    <button class="btn-back" id="btnBackQuiz">← 홈</button>
    <div class="header-title" id="quizTitle"></div>
    <div class="header-badge">✅ <span id="scoreVal">0</span> / <span id="totalVal">0</span></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="quiz-content" id="quizContent">
    <!-- 단일 문제 -->
    <div id="singleQuestion">
      <div class="q-card">
        <div class="q-label" id="qLabel">📖 영어 문장</div>
        <div class="q-sentence" id="qSentence"></div>
      </div>
      <div>
        <div class="answer-label" id="answerLabel">✏️ 순서대로 배열하세요</div>
        <div class="answer-zone" id="answerZone">
          <div class="answer-placeholder">블록을 터치해서 순서대로 올려놓으세요</div>
        </div>
      </div>
      <div>
        <div class="pool-label" id="poolLabel">🔤 한국어 블록</div>
        <div class="block-pool" id="blockPool"></div>
      </div>
    </div>
    <!-- 2개 이상으로 나뉜 문제 (파트 수만큼 자동 생성) -->
    <div id="multiQuestion" style="display:none; flex-direction:column; gap:16px;"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="btn-row">
      <button class="btn btn-reset" id="btnReset">↩ 초기화</button>
      <button class="btn btn-check" id="btnCheck">정답 확인</button>
      <button class="btn btn-skip" id="btnSkip">넘김 ▷</button>
      <button class="btn btn-next" id="btnNext">다음 ▶</button>
    </div>
  </div>
  <div class="final-screen" id="finalScreen">
    <div class="final-emoji" id="finalEmoji">🎉</div>
    <div class="final-title">완료!</div>
    <div class="final-detail" id="finalDetail"></div>
    <button class="btn-home" id="btnHome">🏠 홈으로</button>
  </div>
</div>

<script>
// ══ 데이터 ══
// type: 'single' = 일반 문장, 'pair' = 두 문장 동시 퀴즈
const DATA = {
  1: {
    title: 'Joy of Missing Out',
    sections: {
      'PART 1 FOMO': { label: 'PART 1 FOMO (p.13~14)', pages: ['13','14'] },
      'DAY 1': { label: 'DAY 1 (p.15)', pages: ['15'] },
      'DAY 4': { label: 'DAY 4 (p.16)', pages: ['16'] },
      'DAY 7~11': { label: 'DAY 7~11 (p.17)', pages: ['17'] },

      'Volunteering Online': { label: 'Volunteering Online (p.22)', pages: ['22-1','22-2'] },
    },
    pages: {

        { type:'single', en:'PART 1 FOMO (Fear of Missing Out)', ko:'PART 1 FOMO (두려움으로 놓치는 것)', blocks:['PART 1 FOMO','(두려움으로 놓치는 것)'], enBlocks:['PART 1','FOMO','(Fear of Missing Out)'] },
        { type:'single', en:'"Selena. SELENA!"', ko:'셀레나. / 셀레나!', blocks:['셀레나.','셀레나!'], enBlocks:['"Selena.','SELENA!"'] },
        { type:'single', en:'"Yes," I look up from my phone to discover my mom yelling at me.', ko:'"네," / 나는 눈을 든다 / 내 폰에서 / 발견하게 되는데 / 엄마가 / 소리치고 있음을 / 나에게', blocks:['"네,"','나는 눈을 든다','내 폰에서','발견하게 되는데','엄마가','소리치고 있음을','나에게'], enBlocks:['"Yes,"','I look up','from my phone','to discover','my mom','yelling at me.'] },
        { type:'single', en:'She seems to be searching for an answer to something.', ko:'그녀는 / 찾고 있는 것 같다 / 답을 / 무언가에 대한', blocks:['그녀는','찾고 있는 것 같다','답을','무언가에 대한'], enBlocks:['She','seems to','be searching for','an answer to','something.'] },
        { type:'single', en:'"What?" I asked.', ko:'"뭐라고요?" / 나는 물었다', blocks:['"뭐라고요?"','나는 물었다'], enBlocks:['"What?"','I asked.'] },
        { type:'single', en:'She asked, "Did you not hear what I just said?"', ko:'그녀가 / 물었다, / "듣지 못했니 / 내가 / 방금 / 한 말을?"', blocks:['그녀가','물었다,','"듣지 못했니','내가','방금','한 말을?"'], enBlocks:['She','asked,','"Did you not hear','what','I','just said?"'] },
        { type:'single', en:"No, I didn\'t. I didn't hear anything she said.", ko:'아니, / 못 들었다. / 나는 / 듣지 / 못했다 / 그녀가 한 말을.', blocks:['아니,','못 들었다.','나는','듣지','못했다','그녀가 한 말을.'], enBlocks:['No,','I didn\'t.','I','didn\'t','hear','anything she said.'] },
        { type:'single', en:"I usually don\'t hear a single word said to me by anyone.", ko:'나는 / 보통 / 듣지 못한다 / 한 마디도 / 나에게 하는 말을 / 누구에게서도.', blocks:['나는','보통','듣지 못한다','한 마디도','나에게 하는 말을','누구에게서도.'], enBlocks:['I','usually','don\'t hear','a single word','said to me','by anyone.'] },
        { type:'single', en:'And why is that?', ko:'그런데 / 왜 그럴까?', blocks:['그런데','왜 그럴까?'], enBlocks:['And','why is that?'] },
        { type:'single', en:"It\'s because my eyes are fixed on my phone.", ko:'그것은 때문이다 / 내 눈이 / 고정되어 있기 / 내 폰에', blocks:['그것은 때문이다','내 눈이','고정되어 있기','내 폰에'], enBlocks:['It\'s because','my eyes are','fixed','on my phone.'] },

        { type:'pair', enA: 'Meet Robin Yayla, a visual storyteller living in Milan, Italy,', enB: 'who has been delighting his viewers with his unique artworks on social media.', koA: '만나보세요 Robin Yayla를, / 시각적 이야기꾼인 / 밀라노에 사는, 이탈리아,', koB: '그는 즐겁게 해왔다 / 그의 시청자들을 / 그의 독특한 예술작품들로 / 소셜 미디어에서.', blocksA: ['만나보세요 Robin Yayla를,','시각적 이야기꾼인','밀라노에 사는, 이탈리아,'], blocksB: ['그는 즐겁게 해왔다','그의 시청자들을','그의 독특한 예술작품들로','소셜 미디어에서.'], enBlocksA: ['Meet Robin Yayla,','a visual storyteller','living in Milan, Italy,'], enBlocksB: ['who has been delighting','his viewers','with his unique artworks','on social media.'] },
        { type:'single', en: 'He draws illustrations on top of photos of landmarks or buildings and offers whole new ways to see them.', ko: '그는 그린다 / 일러스트를 / 랜드마크나 건물들의 사진 위에 / 그리고 제공한다 / 완전히 새로운 방법들을 / 그것들을 보는.', blocks: ['그는 그린다','일러스트를','랜드마크나 건물들의 사진 위에','그리고 제공한다','완전히 새로운 방법들을','그것들을 보는.'], enBlocks: ['He draws','illustrations','on top of','photos of','landmarks or buildings','and offers','whole new ways','to see them.'] },
        { type:'pair', enA: 'To breathe life into well-known structures around the world,', enB: 'he often uses iconic pop culture characters.', koA: '생명을 불어넣기 위해 / 세계적으로 유명한 구조물들에', koB: '그는 종종 사용한다 / 상징적인 팝 문화 캐릭터들을.', blocksA: ['생명을 불어넣기 위해','세계적으로 유명한 구조물들에'], blocksB: ['그는 종종 사용한다','상징적인 팝 문화 캐릭터들을.'], enBlocksA: ['To breathe life','into well-known structures','around the world,'], enBlocksB: ['he often uses','iconic pop culture','characters.'] },
        { type:'single', en: 'His unique twists sometimes turn what we consider dull and boring into something delightful.', ko: '그의 독특한 변형들은 / 때때로 바꾼다 / 우리가 지루하고 따분하다고 여기는 것을 / 즐거운 무언가로.', blocks: ['그의 독특한 변형들은','때때로 바꾼다','우리가 지루하고 따분하다고 여기는 것을','즐거운 무언가로.'], enBlocks: ['His unique twists','sometimes turn','what we consider','dull and boring','into something delightful.'] },
        { type:'single', en: 'To him, a bridge is a net, and a road is a bowling lane.', ko: '그에게는, / 다리는 그물이고, / 도로는 볼링 레인이다.', blocks: ['그에게는,','다리는 그물이고,','도로는 볼링 레인이다.'], enBlocks: ['To him,','a bridge is a net,','and a road','is a bowling lane.'] },
        { type:'pair', enA: 'After finding whatever is common in two unrelated things,', enB: 'he connects them smoothly in his digital drawing.', koA: '관련 없는 두 가지에서 / 공통점을 찾은 후,', koB: '그는 연결한다 / 그것들을 매끄럽게 / 그의 디지털 그림에서.', blocksA: ['관련 없는 두 가지에서','공통점을 찾은 후,'], blocksB: ['그는 연결한다','그것들을 매끄럽게','그의 디지털 그림에서.'], enBlocksA: ['After finding','whatever is common','in two unrelated things,'], enBlocksB: ['he connects them','smoothly','in his digital drawing.'] },
      ],
      '39': [
        { type:'single', en: 'His work combines his passion for traveling and drawing.', ko: '그의 작품은 결합한다 / 그의 열정을 / 여행과 그림에 대한.', blocks: ['그의 작품은 결합한다','그의 열정을','여행과 그림에 대한.'], enBlocks: ['His work','combines','his passion','for traveling and drawing.'] },
        { type:'pair', enA: 'Exploring new places and learning about new cultures', enB: 'inspire his artistic mind to come up with new ideas for his art.', koA: '새로운 장소들을 탐험하고 / 새로운 문화들에 대해 배우는 것이', koB: '자극한다 / 그의 예술적 마음을 / 새로운 아이디어들을 떠올리도록 / 그의 예술을 위한.', blocksA: ['새로운 장소들을 탐험하고','새로운 문화들에 대해 배우는 것이'], blocksB: ['자극한다','그의 예술적 마음을','새로운 아이디어들을 떠올리도록','그의 예술을 위한.'], enBlocksA: ['Exploring new places','and learning','about new cultures'], enBlocksB: ['inspire','his artistic mind','to come up with','new ideas','for his art.'] },
        { type:'single', en: 'Many of his digital illustrations transform the most historic buildings of the world into new objects that you would like to see again.', ko: '그의 디지털 일러스트들 중 많은 것들이 / 변환한다 / 세계의 가장 역사적인 건물들을 / 새로운 물체들로 / 당신이 다시 보고 싶은.', blocks: ['그의 디지털 일러스트들 중 많은 것들이','변환한다','세계의 가장 역사적인 건물들을','새로운 물체들로','당신이 다시 보고 싶은.'], enBlocks: ['Many of','his digital illustrations','transform','the most historic buildings of','the world','into new objects','that you would like','to see again.'] },
        { type:'single', en: "For example, he added images of ice cream cones onto the scenic photo of St. Basil's Cathedral in Moscow, the capital of Russia.", ko: '예를 들어, / 그는 추가했다 / 아이스크림 콘 이미지들을 / 성 바실 성당의 풍경 사진 위에 / 모스크바에 있는, / 러시아의 수도인.', blocks: ['예를 들어,','그는 추가했다','아이스크림 콘 이미지들을','성 바실 성당의 풍경 사진 위에','모스크바에 있는,','러시아의 수도인.'], enBlocks: ['For example,','he added','images of ice cream cones','onto the scenic photo of','St. Basil\'s Cathedral','in Moscow,','the capital of Russia.'] },
        { type:'single', en: 'The Leaning Tower of Pisa, one of the most remarkable architectural structures in Italy, appeared to be a camera lens to him.', ko: '피사의 사탑은, / 이탈리아에서 가장 놀라운 건축 구조물들 중 하나인, / 카메라 렌즈처럼 보였다 / 그에게는.', blocks: ['피사의 사탑은,','이탈리아에서 가장 놀라운','건축 구조물들 중 하나인,','카메라 렌즈처럼 보였다','그에게는.'], enBlocks: ['The Leaning Tower of Pisa,','one of','the most remarkable','architectural structures','in Italy,','appeared to be','a camera lens','to him.'] },
      ],
      '40': [
        { type:'single', en: 'Surprising Connection', ko: '놀라운 연결', blocks: ['놀라운','연결'], enBlocks: ['Surprising','Connection'] },
        { type:'single', en: 'Paintings of Rob Gonsalves, a Canadian magic realist artist, combine two different points of view.', ko: 'Rob Gonsalves의 그림들은, / 캐나다의 마술적 사실주의 예술가인, / 결합한다 / 두 가지 다른 관점들을.', blocks: ['Rob Gonsalves의 그림들은,','캐나다의 마술적 사실주의 예술가인,','결합한다','두 가지 다른 관점들을.'], enBlocks: ['Paintings of Rob Gonsalves,','a Canadian magic realist artist,','combine','two different','points of view.'] },
        { type:'pair', enA: 'They give the viewer the visual illusion', enB: 'that they are looking at two unrelated realities flawlessly fused in one painting.', koA: '그것들은 준다 / 보는 사람에게 / 시각적 착시를', koB: '그들이 보고 있다는 / 두 개의 관련 없는 현실들을 / 완벽하게 융합된 / 하나의 그림에.', blocksA: ['그것들은 준다','보는 사람에게','시각적 착시를'], blocksB: ['그들이 보고 있다는','두 개의 관련 없는 현실들을','완벽하게 융합된','하나의 그림에.'], enBlocksA: ['They give','the viewer','the visual illusion'], enBlocksB: ['that they are looking at','two unrelated realities','flawlessly fused','in one painting.'] },
        { type:'single', en: 'They usually depict landscapes and objects that seem to change from one thing to another.', ko: '그것들은 보통 묘사한다 / 풍경들과 물체들을 / 하나에서 다른 것으로 변하는 것처럼 보이는.', blocks: ['그것들은 보통 묘사한다','풍경들과 물체들을','하나에서 다른 것으로','변하는 것처럼 보이는.'], enBlocks: ['They usually','depict','landscapes and objects','that seem to change','from one thing','to another.'] },
        { type:'pair', enA: 'When you look at the top right corner of the painting above,', enB: 'you can see a kid jumping on his bed.', koA: '위의 그림의 / 오른쪽 상단 모서리를 볼 때,', koB: '당신은 볼 수 있다 / 아이가 침대에서 뛰는 것을.', blocksA: ['위의 그림의','오른쪽 상단 모서리를 볼 때,'], blocksB: ['당신은 볼 수 있다','아이가 침대에서 뛰는 것을.'], enBlocksA: ['When you look at','the top right corner','of the painting above,'], enBlocksB: ['you can see','a kid','jumping on his bed.'] },
        { type:'pair', enA: 'However, as you move your eyes across,', enB: 'the bedcovers change into fields, which a girl now appears to be flying over.', koA: '그러나, / 당신이 눈을 가로질러 움직이면,', koB: '침대보는 바뀐다 / 들판으로, / 소녀가 이제 날아가는 것처럼 보이는.', blocksA: ['그러나,','당신이 눈을 가로질러 움직이면,'], blocksB: ['침대보는 바뀐다','들판으로,','소녀가 이제 날아가는 것처럼 보이는.'], enBlocksA: ['However,','as you move','your eyes across,'], enBlocksB: ['the bedcovers','change into fields,','which a girl','now appears to be','flying over.'] },
        { type:'triple', enA: 'This is how the visual illusion is created:', enB: 'an object is gradually changed through a series of similar shapes', enC: 'into something entirely different in a single scene.', koA: '이것이 시각적 착시가 만들어지는 방법이다:', koB: '물체는 점차 바뀐다 / 일련의 유사한 형태들을 통해', koC: '완전히 다른 무언가로 / 하나의 장면에서.', blocksA: ['이것이','시각적 착시가 만들어지는','방법이다:'], blocksB: ['물체는 점차 바뀐다','일련의 유사한 형태들을 통해'], blocksC: ['완전히 다른 무언가로','하나의 장면에서.'], enBlocksA: ['This is how','the visual illusion','is created:'], enBlocksB: ['an object','is gradually changed','through a series of','similar shapes'], enBlocksC: ['into something','entirely different','in a single scene.'] },
        { type:'single', en: 'At the same time, two different parts of the same scene are constructed at different scales.', ko: '동시에, / 같은 장면의 두 다른 부분들이 / 구성된다 / 다른 크기들로.', blocks: ['동시에,','같은 장면의 두 다른 부분들이','구성된다','다른 크기들로.'], enBlocks: ['At the same time,','two different parts of','the same scene','are constructed','at different scales.'] },
        { type:'single', en: 'The result is an unexpected and seemingly impossible whole.', ko: '결과는 / 예상치 못하고 / 불가능해 보이는 / 전체이다.', blocks: ['결과는','예상치 못하고','불가능해 보이는','전체이다.'], enBlocks: ['The result is','an unexpected','and seemingly impossible','whole.'] },
        { type:'single', en: 'This kind of illusion has a fun way of twisting your perception.', ko: '이런 종류의 착시는 / 재미있는 방법을 가지고 있다 / 당신의 인식을 비트는.', blocks: ['이런 종류의 착시는','재미있는 방법을 가지고 있다','당신의 인식을 비트는.'], enBlocks: ['This kind of illusion','has a fun way','of twisting','your perception.'] },
        { type:'single', en: 'It makes you question what is real.', ko: '그것은 만든다 / 당신이 의문을 갖도록 / 무엇이 실제인지.', blocks: ['그것은 만든다','당신이 의문을 갖도록','무엇이 실제인지.'], enBlocks: ['It makes you','question','what is real.'] },
        { type:'triple', enA: 'Most of his incredible paintings have an unclear boundary', enB: 'between the multiple stories they tell,', enC: 'which forces the viewer to jump back and forth between them.', koA: '그의 놀라운 그림들 대부분은 / 불분명한 경계를 가지고 있다', koB: '그것들이 말하는 여러 이야기들 사이의,', koC: '이것은 강요한다 / 보는 사람이 / 앞뒤로 왔다갔다 하도록.', blocksA: ['그의 놀라운 그림들 대부분은','불분명한 경계를 가지고 있다'], blocksB: ['그것들이 말하는','여러 이야기들 사이의,'], blocksC: ['이것은 강요한다','보는 사람이','앞뒤로 왔다갔다 하도록.'], enBlocksA: ['Most of','his incredible paintings','have an unclear boundary'], enBlocksB: ['between','the multiple stories','they tell,'], enBlocksC: ['which forces','the viewer','to jump back and forth','between them.'] },
        { type:'pair', enA: 'Tracing the transitions, you get that delightful "Ah-ha!" feeling', enB: 'as you try to decide exactly where one world transforms into another.', koA: '전환들을 따라가면서, / 당신은 얻는다 / 그 즐거운 "아하!" 느낌을', koB: '당신이 결정하려고 할 때 / 정확히 어디서 / 하나의 세계가 다른 세계로 변하는지.', blocksA: ['전환들을 따라가면서,','당신은 얻는다','그 즐거운 "아하!" 느낌을'], blocksB: ['당신이 결정하려고 할 때','정확히 어디서','하나의 세계가 다른 세계로 변하는지.'], enBlocksA: ['Tracing the transitions,','you get','that delightful "Ah-ha!" feeling'], enBlocksB: ['as you try','to decide exactly','where one world','transforms into another.'] },
      ],
      '41': [
        { type:'single', en: 'Fun Shadows', ko: '재미있는 그림자', blocks: ['재미있는','그림자'], enBlocks: ['Fun','Shadows'] },
        { type:'pair', enA: 'When we look at shadows of objects in real life,', enB: 'most of us think nothing of them.', koA: '우리가 볼 때 / 실제 생활에서 / 물체들의 그림자를,', koB: '우리 대부분은 / 아무 생각도 하지 않는다 / 그것들에 대해.', blocksA: ['우리가 볼 때','실제 생활에서','물체들의 그림자를,'], blocksB: ['우리 대부분은','아무 생각도 하지 않는다','그것들에 대해.'], enBlocksA: ['When we look at','shadows of objects','in real life,'], enBlocksB: ['most of us','think nothing','of them.'] },
        { type:'single', en: 'Belgian artist and film-maker Vincent Bal, however, turns them into art forms.', ko: '벨기에 예술가이자 영화 제작자인 Vincent Bal은, / 그러나, / 바꾼다 / 그것들을 / 예술 형태로.', blocks: ['벨기에 예술가이자 영화 제작자인 Vincent Bal은,','그러나,','바꾼다','그것들을','예술 형태로.'], enBlocks: ['Belgian artist and film-maker','Vincent Bal,','however,','turns them','into art forms.'] },
        { type:'single', en: 'He lets his creativity flow to make beautiful and meaningful scenes with shadows.', ko: '그는 흐르게 한다 / 그의 창의성을 / 만들기 위해 / 아름답고 의미있는 장면들을 / 그림자들로.', blocks: ['그는 흐르게 한다','그의 창의성을','만들기 위해','아름답고 의미있는 장면들을','그림자들로.'], enBlocks: ['He lets','his creativity flow','to make','beautiful and meaningful scenes','with shadows.'] },
        { type:'pair', enA: 'His playful shadow art illustrations are made by adding his own doodles', enB: 'to shadows cast from everyday objects, like a flower or a glass.', koA: '그의 장난스러운 그림자 예술 일러스트들은 / 만들어진다 / 추가함으로써 / 그 자신의 낙서들을', koB: '일상적인 물체들에서 드리워진 그림자들에, / 꽃이나 유리잔처럼.', blocksA: ['그의 장난스러운 그림자 예술 일러스트들은','만들어진다','추가함으로써','그 자신의 낙서들을'], blocksB: ['일상적인 물체들에서 드리워진 그림자들에,','꽃이나 유리잔처럼.'], enBlocksA: ['His playful','shadow art illustrations','are made by','adding his own doodles'], enBlocksB: ['to shadows','cast from everyday objects,','like a flower','or a glass.'] },
        { type:'single', en: 'In one image, the shadow from a key is reinterpreted as a DJ wearing headphones.', ko: '한 이미지에서, / 열쇠의 그림자는 / 재해석된다 / 헤드폰을 쓴 DJ로.', blocks: ['한 이미지에서,','열쇠의 그림자는','재해석된다','헤드폰을 쓴 DJ로.'], enBlocks: ['In one image,','the shadow from a key','is reinterpreted','as a DJ','wearing headphones.'] },
        { type:'single', en: 'In another, a potato peeler creates the perfectly shaped frame for a piano.', ko: '다른 것에서는, / 감자 껍질 벗기개가 / 만든다 / 완벽한 모양의 틀을 / 피아노를 위한.', blocks: ['다른 것에서는,','감자 껍질 벗기개가','만든다','완벽한 모양의 틀을','피아노를 위한.'], enBlocks: ['In another,','a potato peeler','creates','the perfectly shaped frame','for a piano.'] },
        { type:'single', en: 'In his art, the shadow from a glass becomes a pool.', ko: '그의 예술에서, / 유리잔의 그림자는 / 수영장이 된다.', blocks: ['그의 예술에서,','유리잔의 그림자는','수영장이 된다.'], enBlocks: ['In his art,','the shadow from a glass','becomes a pool.'] },
        { type:'single', en: 'He uses a very simple process to draw his pictures.', ko: '그는 사용한다 / 매우 단순한 과정을 / 그의 그림들을 그리기 위해.', blocks: ['그는 사용한다','매우 단순한 과정을','그의 그림들을 그리기 위해.'], enBlocks: ['He uses','a very simple process','to draw his pictures.'] },

let currentUnit = 1, currentPage = 13;
let quizQuestions = [], quizIdx = 0, score = 0;
let answerBlocks = [], poolBlocks = [], checked = false;

// ══ 홈 화면 렌더 ══
function renderHome() {
  const ul = document.getElementById('unitList');
  ul.innerHTML = '';

  Object.entries(DATA).forEach(([unitNum, unitData]) => {
    const card = document.createElement('div');
    card.className = 'accordion-card';

    const header = document.createElement('div');
    header.className = 'accordion-header';
    header.innerHTML = `<span>${unitNum}단원 — ${unitData.title}</span><span class="accordion-arrow">▶</span>`;

    const body = document.createElement('div');
    body.className = 'accordion-body';

    // 소제목 단위로 구성 (sections가 있으면 소제목, 없으면 페이지)
    const sections = unitData.sections || {};
    const hasSections = Object.keys(sections).length > 0;

    if (hasSections) {
      Object.entries(sections).forEach(([sectionKey, section]) => {
        const totalCount = section.pages.reduce((sum, pg) => sum + (unitData.pages[pg] ? unitData.pages[pg].length : 0), 0);
        const item = document.createElement('div');
        item.className = 'page-item';
        item.innerHTML = `
          <div class="page-info">
            <div class="page-num">${section.label}</div>
            <div class="page-count">문장 ${totalCount}개</div>
          </div>
          <div class="page-actions">
            <button class="btn-mode btn-quiz" data-unit="${unitNum}" data-section="${sectionKey}" data-mode="quiz">🎮<br>문장<br>복습</button>
            <button class="btn-mode btn-write" data-unit="${unitNum}" data-section="${sectionKey}" data-mode="write">✍️<br>영작<br>훈련</button>
            <button class="btn-mode btn-review" data-unit="${unitNum}" data-section="${sectionKey}" data-mode="review">📖<br>내용<br>복습</button>
          </div>`;
        body.appendChild(item);
      });
    } else {
      Object.keys(unitData.pages).forEach(pg => {
        const count = unitData.pages[pg].length;
        const item = document.createElement('div');
        item.className = 'page-item';
        item.innerHTML = `
          <div class="page-info">
            <div class="page-num">p. ${pg}</div>
            <div class="page-count">문장 ${count}개</div>
          </div>
          <div class="page-actions">
            <button class="btn-mode btn-quiz" data-unit="${unitNum}" data-page="${pg}" data-mode="quiz">🎮 문장 복습</button>
            <button class="btn-mode btn-write" data-unit="${unitNum}" data-page="${pg}" data-mode="write">✍️ 영작 훈련</button>
            <button class="btn-mode btn-review" data-unit="${unitNum}" data-page="${pg}" data-mode="review">📖 내용 복습</button>
          </div>`;
        body.appendChild(item);
      });
    }

    header.addEventListener('click', () => {
      const isOpen = header.classList.contains('open');
      document.querySelectorAll('.accordion-header').forEach(h => h.classList.remove('open'));
      document.querySelectorAll('.accordion-body').forEach(b => b.classList.remove('open'));
      if (!isOpen) {
        header.classList.add('open');
        body.classList.add('open');
      }
    });

    body.addEventListener('click', function(e) {
      const btn = e.target.closest('.btn-mode');
      if (!btn) return;
      const unit = btn.dataset.unit;
      const section = btn.dataset.section;
      const page = btn.dataset.page;
      const mode = btn.dataset.mode;

      if (section) {
        // 소제목 단위: 여러 페이지 합치기
        const pages = DATA[unit].sections[section].pages;
        const questions = pages.reduce((arr, pg) => arr.concat(DATA[unit].pages[pg] || []), []);
        if (mode === 'quiz') startQuizWithData(questions, `${unit}단원 · ${section}`, 'random');
        else if (mode === 'write') startQuizWithData(questions, `${unit}단원 · ${section}`, 'ko2en');
        else startReviewWithData(questions, `${unit}단원 · ${section}`);
      } else {
        if (mode === 'quiz') startQuiz(unit, page, 'random');
        else if (mode === 'write') startQuiz(unit, page, 'ko2en');
        else startReview(unit, page);
      }
    });

    card.appendChild(header);
    card.appendChild(body);
    ul.appendChild(card);
  });
}


function goHome() {
  document.getElementById('homeScreen').style.display = 'flex';
  document.getElementById('reviewScreen').classList.remove('show');
  document.getElementById('quizScreen').classList.remove('show');
  document.getElementById('finalScreen').classList.remove('show');
  document.getElementById('quizContent').style.display = 'flex';
}

// ══ 복습 모드 ══
function startReview(unit, page) {
  const questions = DATA[unit].pages[page];
  const title = `${unit}단원 · p.${page} 내용 복습`;
  startReviewWithData(questions, title);
}

// 문제 유형(single / pair / triple / multi)을 파트 배열로 통일
function getParts(q) {
  if (q.parts) return q.parts;
  if (q.type === 'triple') return [
    { en: q.enA, ko: q.koA, blocks: q.blocksA, enBlocks: q.enBlocksA },
    { en: q.enB, ko: q.koB, blocks: q.blocksB, enBlocks: q.enBlocksB },
    { en: q.enC, ko: q.koC, blocks: q.blocksC, enBlocks: q.enBlocksC }
  ];
  if (q.type === 'pair') return [
    { en: q.enA, ko: q.koA, blocks: q.blocksA, enBlocks: q.enBlocksA },
    { en: q.enB, ko: q.koB, blocks: q.blocksB, enBlocks: q.enBlocksB }
  ];
  return [{ en: q.en, ko: q.ko, blocks: q.blocks, enBlocks: q.enBlocks }];
}

function startReviewWithData(questions, title) {
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('reviewTitle').textContent = title;
  document.getElementById('reviewBadge').textContent = `${questions.length}문장`;
  const content = document.getElementById('reviewContent');
  content.innerHTML = '';
  let num = 1;
  const slash = s => s.replace(/\//g,'<span style="color:var(--accent2);font-weight:800;padding:0 2px;">/</span>');
  const arrow = ' <span style="color:var(--accent2)">↓</span> ';
  questions.forEach((q) => {
    const parts = getParts(q);
    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML = `
      <div class="review-card-en"><div class="review-num">${num++}</div>${parts.map(p => p.en).join(' ')}</div>
      <div class="review-card-ko">${parts.map(p => slash(p.ko)).join(arrow)}</div>`;
    content.appendChild(card);
  });
  document.getElementById('reviewScreen').classList.add('show');
}

// ══ 퀴즈 모드 ══
let correctSet = new Set();
let quizStartMode = 'random'; // 'random' | 'ko2en' | 'en2ko'
let quizMode = 'en2ko';       // 현재 문제의 방향
let selectedAnswerIdx = -1;   // 한 문장 문제에서 선택된 블록
let mPool = [], mAnswer = [], mSel = []; // 여러 파트 문제: 파트별 블록 풀 / 배열 / 선택

function startQuiz(unit, page, mode = 'random') {
  const questions = DATA[unit].pages[page];
  const modeLabel = mode === 'ko2en' ? '✍️ 영작 훈련' : '🎮 문장 복습';
  const title = `${modeLabel} · p.${page}`;
  startQuizWithData(questions, title, mode);
}

function startQuizWithData(questions, title, mode = 'random') {
  quizStartMode = mode;
  quizQuestions = [...questions];
  quizIdx = 0; score = 0;
  correctSet = new Set();
  document.getElementById('scoreVal').textContent = 0;
  document.getElementById('totalVal').textContent = quizQuestions.length;
  document.getElementById('quizTitle').textContent = title;
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('quizScreen').classList.add('show');
  document.getElementById('finalScreen').classList.remove('show');
  document.getElementById('quizContent').style.display = 'flex';
  loadQuizQuestion();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const PART_LETTERS = 'ABCDEFGH';
function correctOf(p) { return quizMode === 'ko2en' ? p.enBlocks : p.blocks; }

function loadQuizQuestion() {
  checked = false;
  selectedAnswerIdx = -1;
  answerBlocks = [];
  const q = quizQuestions[quizIdx];
  const parts = getParts(q);

  // 모드에 따라 EN↔KO 결정
  if (quizStartMode === 'ko2en') quizMode = 'ko2en';
  else if (quizStartMode === 'en2ko') quizMode = 'en2ko';
  else quizMode = Math.random() < 0.5 ? 'en2ko' : 'ko2en';
  const ko2en = quizMode === 'ko2en';

  document.getElementById('progressBar').style.width = `${((quizIdx+1)/quizQuestions.length)*100}%`;
  document.getElementById('resultMsg').className = 'result-msg';
  document.getElementById('btnCheck').style.display = 'flex';
  document.getElementById('btnNext').style.display = 'none';

  const single = document.getElementById('singleQuestion');
  const multi = document.getElementById('multiQuestion');
  if (parts.length === 1) {
    single.style.display = 'block';
    multi.style.display = 'none';
    const p = parts[0];
    document.getElementById('qLabel').textContent = ko2en ? '🇰🇷 한국어 문장' : '📖 영어 문장';
    document.getElementById('qSentence').textContent = ko2en ? p.ko.replace(/\//g, ' ') : p.en;
    document.getElementById('answerLabel').textContent = ko2en ? '✏️ 영어로 배열하세요' : '✏️ 순서대로 배열하세요';
    document.getElementById('poolLabel').textContent = ko2en ? '🔤 영어 블록' : '🔤 한국어 블록';
    poolBlocks = shuffle([...correctOf(p)]);
    document.getElementById('answerZone').className = 'answer-zone';
    renderPool(); renderAnswer();
  } else {
    single.style.display = 'none';
    multi.style.display = 'flex';
    buildMulti(parts, ko2en);
  }
}

// ── 한 문장 문제 ──
function renderPool() {
  const pool = document.getElementById('blockPool');
  pool.innerHTML = '';
  poolBlocks.forEach((text, i) => {
    const b = document.createElement('div');
    b.className = 'block';
    b.textContent = text;
    b.onclick = () => moveToAnswer(i);
    pool.appendChild(b);
  });
}

function renderAnswer() {
  const zone = document.getElementById('answerZone');
  zone.innerHTML = '';
  if (!answerBlocks.length) {
    const p = document.createElement('div');
    p.className = 'answer-placeholder';
    p.textContent = '블록을 터치해서 순서대로 올려놓으세요';
    zone.appendChild(p);
    selectedAnswerIdx = -1;
    return;
  }
  answerBlocks.forEach((text, idx) => {
    const b = document.createElement('div');
    b.className = 'block in-answer' + (idx === selectedAnswerIdx ? ' selected-block' : '');
    b.textContent = text;
    if (!checked) b.onclick = () => tapAnswerBlock(idx);
    zone.appendChild(b);
  });
}

function tapAnswerBlock(i) {
  if (checked) return;
  if (selectedAnswerIdx === -1) { selectedAnswerIdx = i; renderAnswer(); }
  else if (selectedAnswerIdx === i) { selectedAnswerIdx = -1; renderAnswer(); }
  else {
    const tmp = answerBlocks[selectedAnswerIdx];
    answerBlocks[selectedAnswerIdx] = answerBlocks[i];
    answerBlocks[i] = tmp;
    selectedAnswerIdx = -1; renderAnswer();
  }
}

function moveToAnswer(i) {
  if (checked) return;
  answerBlocks.push(poolBlocks[i]);
  poolBlocks.splice(i, 1);
  renderPool(); renderAnswer();
}

// ── 여러 파트 문제 (PAIR·TRIPLE·4분할·5분할 …) ──
function buildMulti(parts, ko2en) {
  mPool = parts.map(p => shuffle([...correctOf(p)]));
  mAnswer = parts.map(() => []);
  mSel = parts.map(() => -1);
  const box = document.getElementById('multiQuestion');
  box.innerHTML = '';
  parts.forEach((p, k) => {
    const L = PART_LETTERS[k];
    const card = document.createElement('div');
    card.className = 'q-card';
    const lab = document.createElement('div');
    lab.className = 'q-label';
    lab.textContent = (ko2en ? '🇰🇷 한국어 문장 ' : '📖 영어 문장 ') + L;
    const sent = document.createElement('div');
    sent.className = 'q-sentence';
    sent.textContent = ko2en ? p.ko.replace(/\//g, ' ') : p.en;
    card.appendChild(lab); card.appendChild(sent);

    const ansWrap = document.createElement('div');
    const al = document.createElement('div');
    al.className = 'answer-label';
    al.textContent = ko2en ? `✏️ 영어로 배열하세요 ${L}` : `✏️ ${L} 배열`;
    const zone = document.createElement('div');
    zone.className = 'answer-zone';
    zone.id = 'mAns' + k;
    ansWrap.appendChild(al); ansWrap.appendChild(zone);

    const poolWrap = document.createElement('div');
    const pl = document.createElement('div');
    pl.className = 'pool-label';
    pl.textContent = `🔤 ${L} 블록`;
    const pool = document.createElement('div');
    pool.className = 'block-pool';
    pool.id = 'mPool' + k;
    poolWrap.appendChild(pl); poolWrap.appendChild(pool);

    box.appendChild(card); box.appendChild(ansWrap); box.appendChild(poolWrap);
    renderMultiPart(k);
  });
}

function renderMultiPart(k) {
  const pool = document.getElementById('mPool' + k);
  pool.innerHTML = '';
  mPool[k].forEach((text, i) => {
    const b = document.createElement('div');
    b.className = 'block';
    b.textContent = text;
    b.onclick = () => moveToAnswerM(k, i);
    pool.appendChild(b);
  });
  const zone = document.getElementById('mAns' + k);
  zone.innerHTML = '';
  if (!mAnswer[k].length) {
    const p = document.createElement('div');
    p.className = 'answer-placeholder';
    p.textContent = '블록을 터치해서 순서대로 올려놓으세요';
    zone.appendChild(p);
    mSel[k] = -1;
    return;
  }
  mAnswer[k].forEach((text, idx) => {
    const b = document.createElement('div');
    b.className = 'block in-answer' + (idx === mSel[k] ? ' selected-block' : '');
    b.textContent = text;
    if (!checked) b.onclick = () => tapAnswerM(k, idx);
    zone.appendChild(b);
  });
}

function moveToAnswerM(k, i) {
  if (checked) return;
  mAnswer[k].push(mPool[k][i]);
  mPool[k].splice(i, 1);
  renderMultiPart(k);
}

function tapAnswerM(k, i) {
  if (checked) return;
  if (mSel[k] === -1) { mSel[k] = i; }
  else if (mSel[k] === i) { mSel[k] = -1; }
  else {
    const tmp = mAnswer[k][mSel[k]];
    mAnswer[k][mSel[k]] = mAnswer[k][i];
    mAnswer[k][i] = tmp;
    mSel[k] = -1;
  }
  renderMultiPart(k);
}

// ── 초기화 ──
function resetAnswer() {
  checked = false;
  selectedAnswerIdx = -1;
  const q = quizQuestions[quizIdx];
  const parts = getParts(q);
  document.getElementById('resultMsg').className = 'result-msg';
  document.getElementById('btnCheck').style.display = 'flex';
  document.getElementById('btnNext').style.display = 'none';
  if (parts.length === 1) {
    poolBlocks = shuffle([...correctOf(parts[0])]);
    answerBlocks = [];
    document.getElementById('answerZone').className = 'answer-zone';
    renderPool(); renderAnswer();
  } else {
    mPool = parts.map(p => shuffle([...correctOf(p)]));
    mAnswer = parts.map(() => []);
    mSel = parts.map(() => -1);
    parts.forEach((p, k) => {
      document.getElementById('mAns' + k).className = 'answer-zone';
      renderMultiPart(k);
    });
  }
}

// ── 정답 확인 ──
function markCorrect(zone, got, want) {
  zone.querySelectorAll('.block').forEach((b, i) => {
    b.className = got[i] === want[i] ? 'block correct-block' : 'block wrong-block';
  });
}

function checkAnswer() {
  const q = quizQuestions[quizIdx];
  const parts = getParts(q);
  const msg = document.getElementById('resultMsg');
  const want = parts.map(correctOf);
  let isCorrect;

  if (parts.length === 1) {
    if (!answerBlocks.length) return;
    if (answerBlocks.length < want[0].length) {
      msg.className = 'result-msg wrong';
      msg.textContent = '⚠️ 모든 블록을 배치해주세요!';
      return;
    }
    checked = true;
    isCorrect = JSON.stringify(answerBlocks) === JSON.stringify(want[0]);
    const zone = document.getElementById('answerZone');
    markCorrect(zone, answerBlocks, want[0]);
    zone.className = 'answer-zone ' + (isCorrect ? 'correct-zone' : 'wrong-zone');
  } else {
    const letters = parts.map((_, k) => PART_LETTERS[k]).join(', ');
    if (mAnswer.some(a => !a.length)) {
      msg.className = 'result-msg wrong';
      msg.textContent = `⚠️ ${letters} 모두 블록을 배치해주세요!`;
      return;
    }
    if (mAnswer.some((a, k) => a.length < want[k].length)) {
      msg.className = 'result-msg wrong';
      msg.textContent = '⚠️ 모든 블록을 배치해주세요!';
      return;
    }
    checked = true;
    const oks = mAnswer.map((a, k) => JSON.stringify(a) === JSON.stringify(want[k]));
    isCorrect = oks.every(Boolean);
    parts.forEach((p, k) => {
      const zone = document.getElementById('mAns' + k);
      markCorrect(zone, mAnswer[k], want[k]);
      zone.className = 'answer-zone ' + (oks[k] ? 'correct-zone' : 'wrong-zone');
    });
  }

  if (isCorrect) {
    if (!correctSet.has(quizIdx)) { correctSet.add(quizIdx); score = correctSet.size; document.getElementById('scoreVal').textContent = score; }
    msg.className = 'result-msg correct';
    msg.textContent = '🎉 정답입니다!';
  } else {
    msg.className = 'result-msg wrong';
    msg.textContent = '❌ 틀렸어요!';
    setTimeout(() => {
      if (!checked) return;
      msg.textContent = parts.length === 1
        ? '💡 정답: ' + want[0].join(' → ')
        : '💡 ' + want.map((w, k) => PART_LETTERS[k] + ': ' + w.join(' → ')).join(' / ');
    }, 1100);
  }
  document.getElementById('btnCheck').style.display = 'none';
  document.getElementById('btnNext').style.display = 'flex';
}

function nextQuestion() {
  quizIdx++;
  if (quizIdx >= quizQuestions.length) showFinal();
  else loadQuizQuestion();
}

function showFinal() {
  document.getElementById('quizContent').style.display = 'none';
  const fs = document.getElementById('finalScreen');
  fs.classList.add('show');
  const correct = correctSet.size;
  const total = quizQuestions.length;
  const ratio = correct / total;
  document.getElementById('finalEmoji').textContent =
    ratio >= 0.9 ? '🏆' : ratio >= 0.7 ? '🎉' : ratio >= 0.5 ? '😊' : '💪';
  document.getElementById('finalDetail').innerHTML =
    `<strong>${correct} / ${total}</strong>문제 정답<br>정답률 ${Math.round(ratio*100)}%`;
}

// ══ 초기화 ══
renderHome();

// ══ 이벤트 리스너 ══
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btnBackReview').addEventListener('click', goHome);
  document.getElementById('btnBackQuiz').addEventListener('click', goHome);
  document.getElementById('btnReset').addEventListener('click', resetAnswer);
  document.getElementById('btnCheck').addEventListener('click', checkAnswer);
  document.getElementById('btnSkip').addEventListener('click', nextQuestion);
  document.getElementById('btnNext').addEventListener('click', nextQuestion);
  document.getElementById('btnHome').addEventListener('click', goHome);
});
</script>
